$kind: http-request
url: "{{base_url}}/api/v1/health"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function() {
          pm.response.to.have.status(200);
      });
      pm.test('Response has apiVersion v1', function() {
          pm.expect(pm.response.json().apiVersion).to.equal('v1');
      });
    language: text/javascript
order: 2000
