$kind: http-request
name: Import Exam - Success
description: Импорт экзамена из JSON файла. Успешный сценарий.
url: "{{base_url}}/api/{{api_version}}/exams/import"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - postman-cloud:///1f163d86-3ecb-48e0-9410-be962b4d8a6f
      disabled: false
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('request_timestamp', new Date().toISOString());
      console.log('Request started at:', pm.environment.get('request_timestamp'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 (Created)', function() {
          pm.response.to.have.status(201);
      });

      pm.test('Response has exam data', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('id');
          pm.expect(jsonData).to.have.property('title');
          pm.expect(jsonData).to.have.property('questionsCount');
      });

      pm.test('Questions count is correct', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.questionsCount).to.be.greaterThan(0);
      });

      pm.test('Response time < 2000ms', function() {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Сохранить ID экзамена для дальнейшего использования
      var jsonData = pm.response.json();
      pm.collectionVariables.set('exam_id', jsonData.id);
      pm.environment.set('last_exam_id', jsonData.id);

      console.log('Exam imported successfully. ID:', jsonData.id);
    language: text/javascript
examples: ./.resources/Import Exam - Success.resources/examples
order: 1000
