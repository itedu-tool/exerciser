$kind: http-request
description: Тест Rate Limiting - отправить более 10 запросов в час (для import endpoint)
url: "{{base_url}}/api/{{api_version}}/exams/import"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - "{{exam_file_path}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 429 (Too Many Requests)', function() {
          pm.response.to.have.status(429);
      });

      pm.test('Response headers contain rate limit info', function() {
          pm.expect(pm.response.code).to.equal(429);
      });

      pm.test('Response time is fast (rate limiter blocks quickly)', function() {
          pm.expect(pm.response.responseTime).to.be.below(100);
      });
    language: text/javascript
order: 4000
