$kind: http-request
description: Попытка импорта без файла - должна вернуть 400
url: "{{base_url}}/api/{{api_version}}/exams/import"
method: POST
body:
  type: formdata
  content: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 (Bad Request)', function() {
          pm.response.to.have.status(400);
      });

      pm.test('Response has error message', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('error');
      });

      pm.test('Error is about empty file', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.error.toLowerCase()).to.include('файл');
    language: text/javascript
order: 2000
