services:
  mongodb:
    image: mongo:8.3
    container_name: exerciser-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      # БЕЗ аутентификации для development (в production нужна)
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-exerciser_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - exerciser-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.6.4
    container_name: exerciser-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "_ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - exerciser-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webapi:
    build:
      context: .
      dockerfile: Exerciser.WebApi/Dockerfile
    container_name: exerciser-webapi
    restart: unless-stopped
    ports:
      # HTTP порт (host:container)
      - "${API_HOST_PORT:-8080}:8080"
      # HTTPS порт (host:container) - только если используется HTTPS
      # - "${API_HOST_HTTPS_PORT:-5258}:8443"
    volumes:
      # Логирование - сохранение между перезагрузками
      - ./logs:/app/logs
    environment:
      # ASP.NET Core окружение
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      
      # MongoDB - ОТДЕЛЬНЫЕ КОМПОНЕНТЫ (БЕЗ connection string в env!)
      # Приложение конструирует connection string внутри Program.cs
      MongoDbSettings__Host: mongodb
      MongoDbSettings__Port: "27017"
      # БЕЗ аутентификации для development
      # MongoDbSettings__Username: ${MONGO_ROOT_USERNAME:-admin}
      # MongoDbSettings__Password: ${MONGO_ROOT_PASSWORD:-changeme}
      MongoDbSettings__DatabaseName: ${MONGO_DATABASE:-exerciser_db}
      MongoDbSettings__ExamsCollectionName: "Exams"
      
      # Redis
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-},abortConnect=false"
      Redis__InstanceName: "Exerciser_"
      
      # CORS origins - ВСЕГДА устанавливайте для production!
      # Формат: "http://domain1.com,https://domain2.com,http://localhost:3000"
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000,http://127.0.0.1:3000,http://127.0.0.1:5000}
      
      # Логирование
      NLog__LogLevel: ${LOG_LEVEL:-Info}
      
      # HTTPS (когда будет настроено)
      # ASPNETCORE_URLS: "https://+:8443;http://+:8080"
      # ASPNETCORE_Kestrel__Certificates__Default__Path: /etc/ssl/certs/aspnetcore.pfx
      # ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_CERT_PASSWORD}
    
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - exerciser-network
    
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Для HTTPS: mount сертификатов (когда будет настроено)
    # volumes:
    #   - ./certs/aspnetcore.pfx:/etc/ssl/certs/aspnetcore.pfx:ro
    #   - ./certs/aspnetcore-key.pem:/etc/ssl/certs/aspnetcore-key.pem:ro

  student-frontend:
    build:
      context: ./Exerciser.FrontEnd/Student
      dockerfile: Dockerfile
    container_name: exerciser-student
    restart: unless-stopped
    ports:
      - "${STUDENT_HOST_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://webapi:8080/api/v1}
    depends_on:
      - webapi
    networks:
      - exerciser-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-frontend:
    build:
      context: ./Exerciser.FrontEnd/Admin
      dockerfile: Dockerfile
    container_name: exerciser-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-5000}:5000"
    environment:
      API_BASE_URL: ${ADMIN_API_BASE_URL:-http://webapi:8080}
    depends_on:
      - webapi
    networks:
      - exerciser-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  exerciser-network:
    driver: bridge