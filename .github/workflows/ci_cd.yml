name: Build and Push Docker Image (with Compose)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push using docker compose
        run: |
          docker compose build webapi
          docker tag exerciser-webapi:latest ${{ vars.DOCKER_USERNAME }}/exerciser-webapi:latest
          docker push ${{ vars.DOCKER_USERNAME }}/exerciser-webapi:latest
        env:
          BUILD_CONFIGURATION: Release